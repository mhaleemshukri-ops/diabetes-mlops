name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Quick training smoke test
        run: |
          mkdir -p reports
          python train.py 2>&1 | tee reports/training.log
      - name: Unit tests
        run: python -m unittest discover -v 2>&1 | tee reports/tests.log
      - name: Upload trained models, metrics, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-artifacts
          path: |
            models/*.joblib
            models/metrics_*.json
            reports/
          if-no-files-found: error
          retention-days: 14
